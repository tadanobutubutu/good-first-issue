name: CI

on: [push]

# The job only reads the checkout and runs the data tests, so nothing here needs a write scope.
permissions:
  contents: read

jobs:
  test:
    # A blacksmith-* label needs the Blacksmith GitHub App on this repository, which it does not have, so such a job stays unclaimed until GitHub cancels it at the 24 hour queue limit.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: make pre-build

      - name: Run tests for data sanity
        run: make test
